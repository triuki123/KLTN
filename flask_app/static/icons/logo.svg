<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" fill="none">
  <!-- House roof -->
  <path d="M10 28 L30 10 L50 28" stroke="#1F3D2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- House body -->
  <rect x="15" y="27" width="30" height="20" rx="1" fill="#1F3D2E"/>
  <!-- Door -->
  <rect x="24" y="35" width="12" height="12" rx="1" fill="#F7F3E9"/>
  <!-- Lantern hanging from roof peak -->
  <line x1="30" y1="10" x2="30" y2="7" stroke="#C65A3A" stroke-width="1.5"/>
  <rect x="26.5" y="4" width="7" height="9" rx="1.5" fill="#C65A3A" opacity="0.9"/>
  <line x1="29" y1="4" x2="29" y2="13" stroke="#F7F3E9" stroke-width="0.8"/>
  <line x1="31" y1="4" x2="31" y2="13" stroke="#F7F3E9" stroke-width="0.8"/>
  <!-- Book stack bottom-right of house -->
  <rect x="42" y="38" width="10" height="2.5" rx="0.5" fill="#D9C9B4"/>
  <rect x="43" y="34.5" width="9" height="2.5" rx="0.5" fill="#C65A3A"/>
  <rect x="44" y="31" width="8" height="2.5" rx="0.5" fill="#1F3D2E"/>
  <!-- Leaf / plant left side -->
  <path d="M8 47 Q4 40 10 36 Q12 42 8 47Z" fill="#1F3D2E" opacity="0.7"/>
  <path d="M8 47 Q14 42 13 36 Q9 41 8 47Z" fill="#1F3D2E" opacity="0.5"/>
  <line x1="8" y1="47" x2="10" y2="37" stroke="#1F3D2E" stroke-width="1" opacity="0.6"/>
  <!-- Brand text -->
  <text x="60" y="27" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#C65A3A" letter-spacing="-0.5">TRẠM</text>
  <text x="60" y="46" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#1F3D2E" letter-spacing="-0.5">SÁCH</text>
</svg>
